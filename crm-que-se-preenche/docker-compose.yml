# Sobe só este app: docker compose up --build  (http://localhost:3020)
# Nenhuma variável é obrigatória: abra /setup no navegador para conectar a IA e as integrações.
services:
  crm-que-se-preenche:
    build: .
    ports:
      - "3020:10000"
    volumes:
      - dados:/app/data
    restart: unless-stopped

volumes:
  dados:
