name: Publicar imagens e catálogo

# A cada push na main: constrói só as imagens dos apps cuja pasta mudou, publica em ghcr.io/startse/<app>
# e regenera o repositório público (Blueprints do Render + página do catálogo).
# A execução manual permite republicar um app específico ou reconstruir todas as imagens.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      app:
        description: "ID do app a republicar (ex.: mapify; vazio usa o comportamento de reconstruir todas)"
        type: string
        default: ""
      todos:
        description: "Reconstruir todas as imagens"
        type: boolean
        default: false

concurrency:
  group: publicar
  queue: max
  cancel-in-progress: false

env:
  REGISTRO: ghcr.io/startse
  REPO_PUBLICO: git@github.com:StartSe/ai-action-app-deploy.git
  REPO_PUBLICO_HTTP: https://github.com/StartSe/ai-action-app-deploy
  PLATAFORMAS: linux/amd64   # acrescente ",linux/arm64" para Macs com Apple Silicon; exige runner arm ou emulação

jobs:
  mudancas:
    name: Descobrir apps alterados
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.lista.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: lista
        env:
          APP_ALVO: ${{ github.event_name == 'workflow_dispatch' && inputs.app || '' }}
          TODOS: ${{ github.event_name == 'workflow_dispatch' && inputs.todos }}
          ANTES: ${{ github.event.before }}
        run: |
          APPS="$(jq -r '.apps[].id' catalogo.json | sort)"
          if [ -n "$APP_ALVO" ]; then
            if [ "$TODOS" = "true" ]; then
              echo "::error::Escolha um app específico ou a opção de reconstruir todas, não os dois."
              exit 1
            fi
            if ! jq -e --arg app "$APP_ALVO" '.apps | any(.id == $app)' catalogo.json > /dev/null; then
              echo "::error::O app solicitado não existe no catálogo."
              exit 1
            fi
            LISTA="$APP_ALVO"
          elif [ "$TODOS" = "true" ] || [ -z "$ANTES" ] || [ "$ANTES" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$ANTES" 2>/dev/null; then
            LISTA="$APPS"
          else
            ALTERADOS="$(git diff --name-only "$ANTES" "$GITHUB_SHA" | cut -d/ -f1 | sort -u)"
            LISTA="$(comm -12 <(echo "$APPS") <(echo "$ALTERADOS"))"
          fi
          JSON="$(printf '%s\n' "$LISTA" | jq -R -s -c 'split("\n") | map(select(length > 0))')"
          echo "apps=$JSON" >> "$GITHUB_OUTPUT"
          echo "Apps a construir: $JSON"

  imagens:
    name: Imagem ${{ matrix.app }}
    needs: mudancas
    if: needs.mudancas.outputs.apps != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.mudancas.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.app }}
          platforms: ${{ env.PLATAFORMAS }}
          push: true
          # Credenciais da suíte (US-024, envio de avisos pelo Gmail/Outlook da própria pessoa;
          # US-036, leitura das notas no custos-ia; US-038, chave do app no Trello para o
          # agente-kanban): só os apps que declaram esses ARGs no Dockerfile (os já migrados para a
          # fundação nova, entre eles pdi-time, custos-ia, prospeccao-ia e agente-kanban) os
          # consomem; os demais ignoram o build-arg sem erro (aviso "was not consumed") até a própria
          # história de replicação. Sem o segredo cadastrado, o valor chega vazio e o app avisa na
          # tela que a equipe técnica ainda precisa cadastrá-lo.
          build-args: |
            GOOGLE_CLIENT_ID_APP=${{ secrets.GOOGLE_CLIENT_ID_APP }}
            GOOGLE_CLIENT_SECRET_APP=${{ secrets.GOOGLE_CLIENT_SECRET_APP }}
            MICROSOFT_CLIENT_ID_APP=${{ secrets.MICROSOFT_CLIENT_ID_APP }}
            MICROSOFT_CLIENT_SECRET_APP=${{ secrets.MICROSOFT_CLIENT_SECRET_APP }}
            TRELLO_API_KEY_APP=${{ secrets.TRELLO_API_KEY_APP }}
          tags: |
            ${{ env.REGISTRO }}/${{ matrix.app }}:latest
            ${{ env.REGISTRO }}/${{ matrix.app }}:${{ github.sha }}
          # O vínculo herda permissões de acesso, não a visibilidade do pacote.
          # Cada pacote novo precisa ser definido como Public em Package settings.
          labels: |
            org.opencontainers.image.source=${{ env.REPO_PUBLICO_HTTP }}
            org.opencontainers.image.title=${{ matrix.app }}
            org.opencontainers.image.description=IA para Executivos: ${{ matrix.app }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      - name: Capturar prévia do app
        id: captura
        continue-on-error: true
        run: |
          set -e
          mkdir -p /tmp/captura-saida
          # CONTA_DESLIGADA=1 só neste contêiner efêmero de captura: sem ela, toda rota exigiria
          # login e a captura em modo demonstração (`?exemplo=1&captura=1`) cairia em /entrar.
          docker run -d --name captura -e CONTA_DESLIGADA=1 -p 3900:10000 "${{ env.REGISTRO }}/${{ matrix.app }}:${{ github.sha }}"
          ok=""
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3900/api/health > /dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          [ -n "$ok" ] || { echo "app não respondeu em /api/health a tempo"; exit 1; }
          google-chrome --headless=new --no-sandbox --disable-gpu --window-size=1200,800 \
            --run-all-compositor-stages-before-draw --force-prefers-reduced-motion --virtual-time-budget=8000 \
            --screenshot="/tmp/captura-saida/${{ matrix.app }}.png" \
            "http://localhost:3900/?exemplo=1&captura=1"
          test -s "/tmp/captura-saida/${{ matrix.app }}.png"
      - name: Registrar falha de captura (não bloqueia o deploy)
        if: steps.captura.outcome == 'failure'
        run: |
          echo "::warning::Falha ao capturar prévia de ${{ matrix.app }} (catálogo publica sem a prévia deste app)"
          echo "- :warning: Falha ao capturar prévia de \`${{ matrix.app }}\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Limpar contêiner da captura
        if: always()
        run: docker rm -f captura > /dev/null 2>&1 || true
      - name: Enviar captura como artefato
        if: steps.captura.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: captura-${{ matrix.app }}
          path: /tmp/captura-saida/${{ matrix.app }}.png
          retention-days: 1

  publico:
    name: Atualizar repositório público
    needs: [mudancas, imagens]
    # Não divulga botões que apontam para imagens que falharam na construção.
    # !cancelled() é obrigatório: sem uma função de status, o Actions pula este job sempre que
    # "imagens" é pulado (push que só muda catálogo, página ou README), e o repositório público
    # ficava desatualizado.
    if: ${{ !cancelled() && needs.mudancas.result == 'success' && (needs.imagens.result == 'success' || needs.imagens.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Consulta a visibilidade real pela API e confere o manifesto autenticado
      # quando o download anônimo falha mesmo após novas tentativas.
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Recuperar capturas já publicadas (apps não reconstruídos nesta execução)
        continue-on-error: true
        run: |
          mkdir -p capturas
          git clone --depth 1 --branch main "${{ env.REPO_PUBLICO_HTTP }}.git" /tmp/publico-atual 2>/dev/null || true
          if [ -d /tmp/publico-atual/capturas ]; then cp -n /tmp/publico-atual/capturas/*.png capturas/ 2>/dev/null || true; fi
      - name: Baixar capturas geradas na etapa de imagens
        uses: actions/download-artifact@v4
        with:
          pattern: captura-*
          path: capturas
          merge-multiple: true
        continue-on-error: true
      - name: Gerar Blueprints e página
        run: |
          node --test scripts/gerar-deploy.test.mjs
          node scripts/gerar-deploy.mjs
      - name: Publicar em ${{ env.REPO_PUBLICO }}
        env:
          CHAVE_SSH: ${{ secrets.CHAVE_DEPLOY_PUBLICO }}
        run: scripts/publicar-publico.sh "$REPO_PUBLICO"
      - name: Avisar o Render (deploy hooks das instâncias de demonstração)
        if: needs.imagens.result == 'success' && vars.RENDER_DEPLOY_HOOKS_ATIVO == 'true'
        env:
          HOOKS: ${{ secrets.RENDER_DEPLOY_HOOKS }}
          APPS: ${{ needs.mudancas.outputs.apps }}
        run: |
          # RENDER_DEPLOY_HOOKS é um JSON { "pdi-time": "https://api.render.com/deploy/srv-...?key=..." }.
          for app in $(echo "$APPS" | jq -r '.[]'); do
            URL="$(echo "$HOOKS" | jq -r --arg a "$app" '.[$a] // empty')"
            [ -n "$URL" ] && curl -fsS -X POST "$URL" > /dev/null && echo "redeploy pedido: $app" || true
          done
      - name: Conferir se as imagens estão públicas
        env:
          GH_ATOR: ${{ github.actor }}
          GH_SENHA: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --test scripts/verificar-imagens-publicas.test.mjs
          node scripts/verificar-imagens-publicas.mjs
