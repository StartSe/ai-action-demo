# Blueprint de publicação de Entrevistadora IA (especificação: https://render.com/docs/blueprint-spec)
# Imagem pública publicada pelo GitHub Actions em ghcr.io/startse/entrevista-ia:latest.
# Este app exige o plano starter (pago) e cria um disco de 1 GB em /app/data, onde ficam a configuração, a conta, as vagas, os candidatos e as entrevistas.
# Nenhuma chave é necessária aqui.
services:
  - type: web
    name: entrevista-ia
    runtime: image
    image:
      url: ghcr.io/startse/entrevista-ia:latest
    plan: starter
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "10000"
    # A configuração, a conta, as vagas, os candidatos e as entrevistas ficam em /app/data e sobrevivem a deploys.
    disk:
      name: entrevista-ia-dados
      mountPath: /app/data
      sizeGB: 1
