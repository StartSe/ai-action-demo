# Blueprint de publicação de Precificador (especificação: https://render.com/docs/blueprint-spec)
# Imagem pública publicada pelo GitHub Actions em ghcr.io/startse/precificador:latest.
# Este app exige o plano starter (pago) e cria um disco de 1 GB em /app/data, onde ficam a conta, as configurações, o negócio, os custos fixos, os canais, os itens com suas fichas e o histórico de preço.
# Nenhuma chave é necessária aqui.
services:
  - type: web
    name: precificador
    runtime: image
    image:
      url: ghcr.io/startse/precificador:latest
    plan: starter
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "10000"
    # A conta, as configurações, o negócio, os custos fixos, os canais, os itens com suas fichas e o histórico de preço ficam em /app/data e sobrevivem a deploys.
    disk:
      name: precificador-dados
      mountPath: /app/data
      sizeGB: 1
