# Sobe só este app: docker compose up --build  (http://localhost:3024)
# Nenhuma variável é obrigatória: abra /setup no navegador para conectar a IA e as integrações.
services:
  toolkit-dash-builder:
    build: .
    ports:
      - "3024:10000"
    volumes:
      - toolkit-dash-builder-dados:/app/data
    restart: unless-stopped

volumes:
  toolkit-dash-builder-dados:
