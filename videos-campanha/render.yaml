# Blueprint de publicação de Vídeos de Campanha (especificação: https://render.com/docs/blueprint-spec)
# Imagem pública publicada pelo GitHub Actions em ghcr.io/startse/videos-campanha:latest.
# Este app exige o plano starter (pago) e cria um disco de 1 GB em /app/data, onde ficam a configuração feita em /setup, a conta, as campanhas e os projetos e assets do Creative Flow.
# Nenhuma chave é necessária aqui.
services:
  - type: web
    name: videos-campanha
    runtime: image
    image:
      url: ghcr.io/startse/videos-campanha:latest
    plan: starter
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "10000"
    # A configuração feita em /setup, a conta, as campanhas e os projetos e assets do Creative Flow ficam em /app/data e sobrevivem a deploys.
    disk:
      name: videos-campanha-dados
      mountPath: /app/data
      sizeGB: 1
