# Blueprint de publicação de Bússola de IA (especificação: https://render.com/docs/blueprint-spec)
# Imagem pública publicada pelo GitHub Actions em ghcr.io/startse/bussola-ia:latest.
# Instalação gratuita de teste, sem volume: contas, configurações e respostas podem se perder em reinícios e atualizações.
# Para manter os dados, use a opção com volume (pago): https://render.com/deploy?repo=https://github.com/StartSe/ai-action-app-deploy/tree/deploy-bussola-ia-persistente.
# Após publicar, abra o app, crie a conta e conecte a IA em /setup.
services:
  - type: web
    name: bussola-ia
    runtime: image
    image:
      url: ghcr.io/startse/bussola-ia:latest
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "10000"
    # Para manter a configuração feita em /setup entre deploys (exige plano pago):
    # disk:
    #   name: bussola-ia-dados
    #   mountPath: /app/data
    #   sizeGB: 1
