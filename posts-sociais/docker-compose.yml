# Sobe só este app: docker compose up --build  (http://localhost:3004)
# Nenhuma variável é obrigatória: abra /setup no navegador para conectar a IA e as integrações.
services:
  posts-sociais:
    build: .
    ports:
      - "3004:10000"
    volumes:
      - dados:/app/data
    restart: unless-stopped

volumes:
  dados:
