# Sobe só este app: docker compose up --build  (http://localhost:3002)
# Nenhuma variável é obrigatória: abra /setup no navegador para conectar a IA e o Trello.
services:
  agente-kanban:
    build: .
    ports:
      - "3002:10000"
    volumes:
      - dados:/app/data
    restart: unless-stopped

volumes:
  dados:
