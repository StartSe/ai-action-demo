services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    expose:
      - "10000"
    environment:
      NODE_ENV: production
      PORT: "10000"
      HOSTNAME: 0.0.0.0
      DATA_DIR: /app/data
      APP_URL: ${APP_URL:?Informe a URL publica HTTPS do aplicativo}
    volumes:
      - dados:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:10000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    stop_grace_period: 30s
volumes:
  dados:
