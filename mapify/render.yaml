# Blueprint de publicação de Mapify (especificação: https://render.com/docs/blueprint-spec)
# Imagem pública publicada pelo GitHub Actions em ghcr.io/startse/mapify:latest.
# Este app exige o plano starter (pago) e cria um disco de 1 GB em /app/data, onde ficam mapas, fontes, conversas, conta e credenciais.
# Crie sua conta, explore um mapa de exemplo e abra Conectar IA para usar sua assinatura ChatGPT ou uma chave OpenRouter. Depois importe uma fonte para gerar seu primeiro mapa.
services:
  - type: web
    name: mapify
    runtime: image
    image:
      url: ghcr.io/startse/mapify:latest
    plan: starter
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "10000"
    # Mapas, fontes, conversas, conta e credenciais ficam em /app/data e sobrevivem a deploys.
    disk:
      name: mapify-dados
      mountPath: /app/data
      sizeGB: 1
