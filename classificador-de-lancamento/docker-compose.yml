# Sobe só este app: docker compose up --build  (http://localhost:3025)
# Nenhuma variável é obrigatória: abra /setup no navegador para conectar a IA.
services:
  classificador-de-lancamento:
    build: .
    ports:
      - "3025:10000"
    volumes:
      - dados:/app/data
    restart: unless-stopped

volumes:
  dados:
