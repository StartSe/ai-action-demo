# Blueprint único da suíte IA para Executivos: publica os 23 apps de uma vez.
# PDI do Time exige o plano 0.5c-512mb (pago); Entrevistadora IA exige o plano standard (pago); Prospecção com IA exige o plano starter (pago); Atendente no WhatsApp exige o plano starter (pago); Radar de Sinais exige o plano starter (pago); Bússola de IA exige o plano 0.5c-512mb (pago); Simulador de Vendas exige o plano starter (pago); Site Cowork exige o plano 0.5c-512mb (pago); Vídeos de Campanha exige o plano starter (pago); AutoML exige o plano standard (pago); Build Agentflows exige o plano starter (pago); Daily Second Brain exige o plano starter (pago); Mapia exige o plano starter (pago); Cowork Jev exige o plano starter (pago); os outros 9 são gratuitos.
# Cada app também tem seu próprio Blueprint (branch deploy-<app> em https://github.com/StartSe/ai-action-app-deploy).
# Imagens públicas publicadas pelo GitHub Actions em ghcr.io/startse/<app>:latest.
# Nenhuma chave é necessária aqui: após publicar, abra /setup em cada app e conecte a IA.
# Gerado por scripts/gerar-deploy.mjs a partir de catalogo.json. Não edite à mão.
services:
  - type: web
    name: pdi-time
    runtime: image
    image:
      url: ghcr.io/startse/pdi-time:latest
    plan: 0.5c-512mb
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "10000"
    # A conta, as configurações, os PDIs, as entregas, as autoavaliações e os check-ins ficam em /app/data e sobrevivem a deploys.
    disk:
      name: pdi-time-dados
      mountPath: /app/data
      sizeGB: 1

