# Blueprint único da suíte IA para Executivos: publica os 18 apps de uma vez.
# Entrevistadora IA exige o plano starter (pago); Atendente no WhatsApp exige o plano starter (pago); Vídeos de Campanha exige o plano starter (pago); AutoML exige o plano standard (pago); os outros 14 são gratuitos.
# Cada app também tem seu próprio Blueprint (branch deploy-<app> em https://github.com/StartSe/ai-action-app-deploy).
# Imagens públicas publicadas pelo GitHub Actions em ghcr.io/startse/<app>:latest.
# Nenhuma chave é necessária aqui: após publicar, abra /setup em cada app e conecte a IA.
# Gerado por scripts/gerar-deploy.mjs a partir de catalogo.json. Não edite à mão.
services:
  - type: web
    name: pdi-time
    runtime: image
    image:
      url: ghcr.io/startse/pdi-time:latest
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "10000"
    # Para manter a configuração feita em /setup entre deploys (exige plano pago):
    # disk:
    #   name: pdi-time-dados
    #   mountPath: /app/data
    #   sizeGB: 1

  - type: web
    name: agente-kanban
    runtime: image
    image:
      url: ghcr.io/startse/agente-kanban:latest
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "10000"
    # Para manter a configuração feita em /setup entre deploys (exige plano pago):
    # disk:
    #   name: agente-kanban-dados
    #   mountPath: /app/data
    #   sizeGB: 1

  - type: web
    name: entrevista-ia
    runtime: image
    image:
      url: ghcr.io/startse/entrevista-ia:latest
    plan: starter
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "10000"
    # A configuração, a conta, as vagas, os candidatos e as entrevistas ficam em /app/data e sobrevivem a deploys.
    disk:
      name: entrevista-ia-dados
      mountPath: /app/data
      sizeGB: 1

