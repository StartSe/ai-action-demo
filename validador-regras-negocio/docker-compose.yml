# Sobe só este app: docker compose up --build  (http://localhost:3019)
# Nenhuma variável é obrigatória: abra /setup no navegador para conectar a IA e as integrações.
services:
  validador-regras-negocio:
    build: .
    ports:
      - "3019:10000"
    volumes:
      - dados:/app/data
    restart: unless-stopped

volumes:
  dados:
