# Sobe a suíte inteira: docker compose up --build   (ou docker compose pull && docker compose up, sem construir nada)
# Cada app fica em uma porta: 3001 a 3018 (veja a tabela no README).
# Nenhuma variável é obrigatória: abra http://localhost:30XX/setup em cada app para conectar a IA e as integrações.
# As chaves ficam em SQLite dentro do volume de cada app e sobrevivem a reinícios.
# Um .env na raiz é opcional (copie de .env.example); variáveis de ambiente têm prioridade sobre o setup.

x-app: &app
  restart: unless-stopped
  env_file:
    - path: .env
      required: false

services:
  pdi-time:
    <<: *app
    build: ./pdi-time
    image: ghcr.io/startse/pdi-time:latest
    ports: ["3001:10000"]
    volumes: [pdi-time-dados:/app/data]

  agente-kanban:
    <<: *app
    build: ./agente-kanban
    image: ghcr.io/startse/agente-kanban:latest
