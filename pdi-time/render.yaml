# Blueprint do Render para PDI do Time (https://render.com/docs/blueprint-spec)
# Imagem pública publicada pelo GitHub Actions em ghcr.io/startse/pdi-time:latest.
# Nenhuma chave é necessária aqui: após o deploy, abra https://<seu-app>.onrender.com/setup e conecte a IA.
# As chaves ficam em SQLite em /app/data. No plano free o disco é efêmero e a configuração se perde a cada deploy.
services:
  - type: web
    name: pdi-time
    runtime: image
    image:
      url: ghcr.io/startse/pdi-time:latest
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "10000"
    # Para manter a configuração feita em /setup entre deploys (exige plano pago):
    # disk:
    #   name: dados
    #   mountPath: /app/data
    #   sizeGB: 1
