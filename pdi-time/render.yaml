# Blueprint de publicação de PDI do Time (especificação: https://render.com/docs/blueprint-spec)
# Imagem pública publicada pelo GitHub Actions em ghcr.io/startse/pdi-time:latest.
# Este app exige o plano 0.5c-512mb (pago) e cria um disco de 1 GB em /app/data, onde ficam a conta, as configurações, os PDIs, as entregas, as autoavaliações e os check-ins.
# Nenhuma chave é necessária aqui.
services:
  - type: web
    name: pdi-time
    runtime: image
    image:
      url: ghcr.io/startse/pdi-time:latest
    plan: 0.5c-512mb
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "10000"
    # A conta, as configurações, os PDIs, as entregas, as autoavaliações e os check-ins ficam em /app/data e sobrevivem a deploys.
    disk:
      name: pdi-time-dados
      mountPath: /app/data
      sizeGB: 1
