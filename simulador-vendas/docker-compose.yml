# Sobe só este app: docker compose up --build  (http://localhost:3013)
# Nenhuma variável é obrigatória: abra /setup no navegador para conectar a IA e as integrações.
services:
  simulador-vendas:
    build: .
    ports:
      - "3013:10000"
    volumes:
      - dados:/app/data
    restart: unless-stopped

  voz:
    profiles: [voz]
    build:
      context: .
      dockerfile: agent/Dockerfile
    volumes:
      - dados:/app/data
    restart: unless-stopped

volumes:
  dados:
