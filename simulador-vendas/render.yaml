# Blueprint de publicação de Simulador de Vendas (especificação: https://render.com/docs/blueprint-spec)
# Imagem pública publicada pelo GitHub Actions em ghcr.io/startse/simulador-vendas:latest.
# Este app exige o plano starter (pago) e cria um disco de 1 GB em /app/data, onde ficam produtos, materiais, treinos, avaliações e configurações cifradas.
# Nenhuma chave é necessária aqui.
services:
  - type: web
    name: simulador-vendas
    runtime: image
    image:
      url: ghcr.io/startse/simulador-vendas:latest
    plan: starter
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "10000"
    # Produtos, materiais, treinos, avaliações e configurações cifradas ficam em /app/data e sobrevivem a deploys.
    disk:
      name: simulador-vendas-dados
      mountPath: /app/data
      sizeGB: 1
