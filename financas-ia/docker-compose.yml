# Sobe só este app: docker compose up --build  (http://localhost:3009)
# Nenhuma variável é obrigatória: abra /setup no navegador para conectar a IA e as integrações.
services:
  financas-ia:
    build: .
    ports:
      - "3009:10000"
    volumes:
      - dados:/app/data
    restart: unless-stopped

volumes:
  dados:
