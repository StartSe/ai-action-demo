# Blueprint de publicação de Voz do Cliente (especificação: https://render.com/docs/blueprint-spec)
# Imagem pública publicada pelo GitHub Actions em ghcr.io/startse/voz-do-cliente:latest.
# Nenhuma chave é necessária aqui: após publicar, abra /setup no app e conecte a IA.
# As chaves ficam em SQLite em /app/data. No plano free o disco é efêmero e a configuração se perde a cada deploy.
services:
  - type: web
    name: voz-do-cliente
    runtime: image
    image:
      url: ghcr.io/startse/voz-do-cliente:latest
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "10000"
    # Para manter a configuração feita em /setup entre deploys (exige plano pago):
    # disk:
    #   name: voz-do-cliente-dados
    #   mountPath: /app/data
    #   sizeGB: 1
