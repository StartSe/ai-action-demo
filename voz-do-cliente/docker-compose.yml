# Sobe só este app: docker compose up --build  (http://localhost:3010)
# Nenhuma variável é obrigatória: abra /setup no navegador para conectar a IA e as integrações.
services:
  voz-do-cliente:
    build: .
    ports:
      - "3010:10000"
    volumes:
      - dados:/app/data
    restart: unless-stopped

volumes:
  dados:
