# Sobe só este app: docker compose up --build  (http://localhost:3015)
# Nenhuma variável é obrigatória: abra /setup no navegador para conectar a IA e as integrações.
services:
  clone-site:
    build: .
    ports:
      - "3015:10000"
    volumes:
      - dados:/app/data
    restart: unless-stopped

volumes:
  dados:
