# Blueprint de publicação de Site Cowork (especificação: https://render.com/docs/blueprint-spec)
# Imagem pública publicada pelo GitHub Actions em ghcr.io/startse/clone-site:latest.
# Este app exige o plano 0.5c-512mb (pago) e cria um disco de 1 GB em /app/data, onde ficam a conta, as configurações, a sessão ChatGPT, os sites, as versões das páginas e as imagens.
# Nenhuma chave é necessária aqui.
services:
  - type: web
    name: clone-site
    runtime: image
    image:
      url: ghcr.io/startse/clone-site:latest
    plan: 0.5c-512mb
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "10000"
    # A conta, as configurações, a sessão ChatGPT, os sites, as versões das páginas e as imagens ficam em /app/data e sobrevivem a deploys.
    disk:
      name: clone-site-dados
      mountPath: /app/data
      sizeGB: 1
