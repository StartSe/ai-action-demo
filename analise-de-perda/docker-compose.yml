# Sobe só este app: docker compose up --build  (http://localhost:3024)
# Nenhuma variável é obrigatória: abra /setup no navegador para conectar a IA.
services:
  analise-de-perda:
    build: .
    ports:
      - "3024:10000"
    volumes:
      - dados:/app/data
    restart: unless-stopped

volumes:
  dados:
